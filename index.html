    :root{
      --bg: #ffffff;
      --surface: #f6f6f7;
      --line: #ececee;
      --text: #15171a;
      --muted: #8a8d93;
      --btn: #b41912;
      --btn-2: #8d120c;
      --btn-radius: 14px;
      --max-width: 480px;
      --gap: 12px;
      --shadow: 0 10px 26px rgba(20,20,20,0.07);
      --shadow-hover: 0 16px 34px rgba(180,25,18,0.18);
    }
    *{box-sizing:border-box}
    html{ overflow-x:hidden; background:var(--bg); }
    html,body{
      margin:0;
      width:100%;
      min-height:100%;
      font-family:Inter, system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial;
      background:var(--bg);
      color:var(--text);
      -webkit-font-smoothing:antialiased;
      -moz-osx-font-smoothing:grayscale;
      overflow-x:hidden;
    }
    body{
      display:flex;
      align-items:flex-start;
      justify-content:center;
      padding:28px 18px 40px;
    }
    .card{
      width:100%;
      max-width:var(--max-width);
      text-align:center;
      box-sizing:border-box;
      opacity:0;
      transform:translateY(10px);
      animation:cardIn .55s cubic-bezier(.2,.8,.2,1) forwards;
    }
    @keyframes cardIn{ to{ opacity:1; transform:translateY(0);} }

    /* LOGO */
    .logo-wrap{
      width:128px;height:128px;margin:0 auto 16px;
      border-radius:50%;
      background:#fff;
      border:1px solid var(--line);
      box-shadow:var(--shadow);
      display:block;
      padding:0;
      overflow:hidden;
    }
    .logo-wrap img{width:100%;height:100%;object-fit:cover;display:block}

    .name{font-weight:700;font-size:20px;letter-spacing:.2px;margin-bottom:4px}
    .bio-sub{color:var(--muted);font-size:13px;margin-bottom:22px}

    /* BUTTONS */
    .buttons{display:flex;flex-direction:column;gap:var(--gap)}
    .btn{
      display:flex;align-items:center;gap:14px;
      padding:15px 18px;border-radius:var(--btn-radius);
      background:linear-gradient(180deg,var(--btn),var(--btn-2));
      color:#fff;text-decoration:none;font-weight:600;font-size:16px;
      box-shadow:0 8px 20px rgba(180,25,18,0.16);
      transition:transform .22s ease, box-shadow .22s ease;
      border:1px solid rgba(0,0,0,0.04);
      position:relative;overflow:hidden;
      opacity:0;transform:translateY(8px);
      animation:btnIn .5s cubic-bezier(.2,.8,.2,1) forwards;
    }
    .btn:nth-child(1){animation-delay:.05s}
    .btn:nth-child(2){animation-delay:.10s}
    .btn:nth-child(3){animation-delay:.15s}
    .btn:nth-child(4){animation-delay:.20s}
    .btn:nth-child(5){animation-delay:.25s}
    @keyframes btnIn{ to{opacity:1;transform:translateY(0);} }

    .btn .icon{width:26px;height:26px;flex:0 0 26px;display:inline-flex;align-items:center;justify-content:center}
    .btn .label{flex:1;text-align:left}

    .btn::after{content:"";position:absolute;top:0;left:-40%;width:40%;height:100%;
      background:linear-gradient(90deg, rgba(255,255,255,0) 0%, rgba(255,255,255,0.22) 50%, rgba(255,255,255,0) 100%);
      transform:skewX(-20deg);opacity:0}
    .btn:hover::after{left:120%;opacity:1;transition:none;animation:shineMove 1s linear}
    @keyframes shineMove{0%{left:-40%}100%{left:120%}}

    .btn:hover{transform:translateY(-3px);box-shadow:var(--shadow-hover)}
    .btn:active{transform:translateY(0px) scale(.99)}

    /* MAP */
    .map-card{
      width:100%;border-radius:14px;overflow:hidden;border:1px solid var(--line);
      box-shadow:var(--shadow);margin-top:4px;display:block;
      aspect-ratio:2.2/1;
      opacity:0;transform:translateY(8px);animation:btnIn .5s cubic-bezier(.2,.8,.2,1) forwards;
      animation-delay:.30s;
      background:var(--surface);
    }
    .map-card img{width:100%;height:100%;display:block;object-fit:cover;object-position:center}

    /* FOOTER / dev link */
    .footer{margin-top:26px;font-size:11px;color:#c7c8cb;cursor:pointer;user-select:none}
    .footer:hover{color:#a7a9ad}

    /* SHARE FLOATING BUTTON */
    .share-btn{
      position:fixed;right:18px;bottom:18px;width:52px;height:52px;border-radius:16px;
      background:var(--btn);display:flex;align-items:center;justify-content:center;

    .share-btn:active{transform:translateY(0) scale(.97)}
    .share-btn.share-flash{box-shadow:0 14px 34px rgba(180,25,18,0.4)}

    /* MODAL (gate + dashboard) */

    .modal-overlay.show{display:flex}
    .modal{background:#fff;border-radius:20px;max-width:700px;width:95%;padding:28px;box-shadow:0 24px 60px rgba(0,0,0,0.25);max-height:92vh;overflow-y:auto}
    .modal h3{margin:0 0 16px;font-size:22px}
    .modal input{width:100%;padding:14px 16px;border-radius:12px;border:1px solid var(--line);font-size:16px;box-sizing:border-box;margin-bottom:14px}
    .modal .row-actions{display:flex;gap:12px}
    .modal button.action{flex:1;padding:14px;border-radius:12px;border:none;font-weight:600;font-size:15px;cursor:pointer}
    .modal button.primary{background:var(--btn);color:#fff}
    .modal button.ghost{background:var(--surface);color:var(--text)}
    .err-msg{color:var(--btn);font-size:13px;margin:-6px 0 10px;display:none}

    /* DASHBOARD ENHANCEMENTS */
    .dash-summary { display: flex; gap: 12px; margin-bottom: 20px; }
    .summary-card { flex: 1; background: var(--surface); border-radius: 14px; padding: 16px 8px; text-align: center; border: 1px solid var(--line); }
    .summary-card .val { font-size: 22px; font-weight: 700; color: var(--btn); margin-bottom: 4px; }
    .summary-card .lbl { font-size: 12px; color: var(--muted); font-weight: 600; line-height: 1.2; }

    .dash-tabs{display:flex;gap:8px;margin-bottom:20px;overflow-x:auto;padding-bottom:4px;}
    .dash-tabs::-webkit-scrollbar{height:0;}
    .dash-tabs button{flex:1;min-width:70px;padding:12px;border-radius:10px;border:1px solid var(--line);background:#fff;font-size:14px;font-weight:600;cursor:pointer;color:var(--muted);transition:all .2s ease;}
    .dash-tabs button.active{background:var(--text);color:#fff;border-color:var(--text)}
    
    .stat-row{display:flex;align-items:center;gap:14px;padding:14px 0;border-bottom:1px solid var(--line)}
    .stat-row:last-child{border-bottom:none}
    .stat-row .ic{width:38px;height:38px;border-radius:10px;background:var(--surface);display:flex;align-items:center;justify-content:center;flex:0 0 38px}
    .stat-row .ic svg{width:20px;height:20px}
    .stat-row .meta{flex:1;text-align:left}
    .stat-row .meta .t{font-size:15px;font-weight:600}
    .stat-row .meta .bar{height:6px;border-radius:4px;background:var(--surface);margin-top:6px;overflow:hidden}
    .stat-row .meta .bar i{display:block;height:100%;background:var(--btn);border-radius:4px;width:0%;transition:width .5s ease}
    .stat-row .num{font-weight:700;font-size:17px;min-width:40px;text-align:right}
    .loading-txt{font-size:15px;color:var(--muted);text-align:center;padding:20px 0}

    @media (min-width:520px){
      body{padding:40px 18px}
      .logo-wrap{width:148px;height:148px}
    }

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js";
    import { getAnalytics, logEvent } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-analytics.js";
    import { getDatabase, ref, get, update, increment } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyAFt3rm-lSmfxLqJ7GCUnWvrnWJPnwpNdk",
      authDomain: "nam-avtobazar.firebaseapp.com",
      databaseURL: "https://nam-avtobazar-default-rtdb.firebaseio.com",
      projectId: "nam-avtobazar",
      storageBucket: "nam-avtobazar.firebasestorage.app",
      messagingSenderId: "1042633119605",
      appId: "1:1042633119605:web:17aa8c25a02b049eb5653c",
      measurementId: "G-2S6TNC89ZG"
    };

    const app = initializeApp(firebaseConfig);
    let analytics = null;
    try { analytics = getAnalytics(app); } catch (e) { /* analytics ishlamasa ham sayt ishlashda davom etadi */ }
    const db = getDatabase(app);

    function todayKey(){
      const d = new Date();
      return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
    }

    function monthlyKey(){
      const d = new Date();
      return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0');
    }

    function weeklyKey(){
      const d = new Date();
      d.setHours(0,0,0,0);
      d.setDate(d.getDate() + 3 - (d.getDay() + 6) % 7);
      const week1 = new Date(d.getFullYear(), 0, 4);
      const weekNo = 1 + Math.round(((d.getTime() - week1.getTime()) / 86400000 - 3 + (week1.getDay() + 6) % 7) / 7);
      return d.getFullYear() + '-W' + String(weekNo).padStart(2,'0');
    }

    let isUnique = false;
    if(!localStorage.getItem('visited_nam_avto')){
      localStorage.setItem('visited_nam_avto', '1');
      isUnique = true;
    }

    async function track(key){
      try{
        const updates = {};
        updates[`analytics/total/${key}`] = increment(1);
        updates[`analytics/daily_${todayKey()}/${key}`] = increment(1);
        updates[`analytics/weekly_${weeklyKey()}/${key}`] = increment(1);
        updates[`analytics/monthly_${monthlyKey()}/${key}`] = increment(1);

        if (key === 'visits' && isUnique) {
          updates[`analytics/total/unique_visits`] = increment(1);
          updates[`analytics/daily_${todayKey()}/unique_visits`] = increment(1);
          updates[`analytics/weekly_${weeklyKey()}/unique_visits`] = increment(1);
          updates[`analytics/monthly_${monthlyKey()}/unique_visits`] = increment(1);
        }

        await update(ref(db), updates);
        if (analytics) logEvent(analytics, key === 'visits' ? 'page_view' : ('click_' + key));
      }catch(e){ console.warn('track error', e); }
    }

    window.__track = track;
    track('visits');

    ['btn-phone','btn-tg','btn-tg-admin','btn-ig','btn-location','map-link'].forEach((id)=>{
      const el = document.getElementById(id);
      if(!el) return;
      const key = id === 'btn-phone' ? 'phone'
        : id === 'btn-tg' ? 'tg'
        : id === 'btn-tg-admin' ? 'tgAdmin'
        : id === 'btn-ig' ? 'instagram'
        : 'location';
      el.addEventListener('click', ()=>track(key));
    });

    window.__loadStats = async function(){
      const snapshot = await get(ref(db, 'analytics'));
      if(snapshot.exists()){
        const data = snapshot.val();
        return {
          total: data['total'] || {},
          today: data['daily_' + todayKey()] || {},
          week: data['weekly_' + weeklyKey()] || {},
          month: data['monthly_' + monthlyKey()] || {}
        };
      }
      return { total:{}, today:{}, week:{}, month:{} };
    };
  </script>

    const ICONS = {
      visits: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7z" stroke="#b41912" stroke-width="1.8"/><circle cx="12" cy="12" r="3" stroke="#b41912" stroke-width="1.8"/></svg>',
      phone: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M3.6 4.2h3.1c.6 0 1.1.4 1.3 1l1 2.8c.2.5 0 1.1-.4 1.5l-1.5 1.4a13.6 13.6 0 0 0 6.3 6.3l1.4-1.5c.4-.4 1-.5 1.5-.3l2.8 1c.6.2 1 .7 1 1.3v3.1c0 .8-.7 1.4-1.5 1.3C9.6 21.4 2.6 14.4 2.3 5.7 2.2 4.9 2.8 4.2 3.6 4.2z" stroke="#b41912" stroke-width="1.8"/></svg>',
      tg: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M21.5 3.8L3 11.1c-.8.3-.8 1.5 0 1.8l4.7 1.8 1.8 5.6c.3.9 1.2 1 1.7.4l2.7-2.8 4.2 2.9c.7.5 1.7.1 1.9-.8l2.3-14.7c.2-.9-.7-1.7-1.5-1.5z" stroke="#b41912" stroke-width="1.8"/></svg>',
      tgAdmin: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M21.5 3.8L3 11.1c-.8.3-.8 1.5 0 1.8l4.7 1.8 1.8 5.6c.3.9 1.2 1 1.7.4l2.7-2.8 4.2 2.9c.7.5 1.7.1 1.9-.8l2.3-14.7c.2-.9-.7-1.7-1.5-1.5z" stroke="#b41912" stroke-width="1.8"/></svg>',
      instagram: '<svg width="16" height="16" viewBox="0 0 24 24"><rect x="3.2" y="3.2" width="17.6" height="17.6" rx="5.5" stroke="#b41912" stroke-width="1.8" fill="none"/><circle cx="12" cy="12" r="3.4" stroke="#b41912" stroke-width="1.8" fill="none"/></svg>',
      location: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M12 21s7-6.1 7-11.6A7 7 0 0 0 5 9.4C5 14.9 12 21 12 21z" stroke="#b41912" stroke-width="1.8"/></svg>',
      share: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M4 12v7a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-7" stroke="#b41912" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M12 3v13" stroke="#b41912" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M8 7l4-4 4 4" stroke="#b41912" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>'
    };
    const LABELS = { visits:'Tashriflar (kirim)', phone:'Telefon', tg:'Telegram Kanal', tgAdmin:'Telegram Admin', instagram:'Instagram', location:'Manzil/Karta', share:'Ulashish (Share)' };
    const ORDER = ['visits','phone','tg','tgAdmin','instagram','location','share'];

    let lastStats = null;
    let activeTab = 'today';

    function renderTab(data){
      const sumVisits = data['visits'] || 0;
      const sumUnique = data['unique_visits'] || 0;
      let sumClicks = 0;
      ORDER.forEach(k => { if(k !== 'visits') sumClicks += (data[k] || 0); });

      if(sumVisitsEl) sumVisitsEl.textContent = sumVisits;
      if(sumUniqueEl) sumUniqueEl.textContent = sumUnique;
      if(sumClicksEl) sumClicksEl.textContent = sumClicks;

      const max = Math.max(1, ...ORDER.map(k => data[k] || 0));
      dashBody.innerHTML = ORDER.map((k)=>{
        const val = data[k] || 0;
        const pct = Math.round((val/max)*100);
        return '<div class="stat-row"><div class="ic">'+ICONS[k]+'</div><div class="meta"><div class="t">'+LABELS[k]+'</div><div class="bar"><i style="width:'+pct+'%"></i></div></div><div class="num">'+val+'</div></div>';
      }).join('');
    }

    function setTab(tab){
      activeTab = tab;
      tabToday.classList.toggle('active', tab === 'today');
      tabWeek.classList.toggle('active', tab === 'week');
      tabMonth.classList.toggle('active', tab === 'month');
      tabTotal.classList.toggle('active', tab === 'total');
      
      if(lastStats) {
        if(tab === 'today') renderTab(lastStats.today);
        else if(tab === 'week') renderTab(lastStats.week);
        else if(tab === 'month') renderTab(lastStats.month);
        else renderTab(lastStats.total);
      }
    }
    
    tabToday.addEventListener('click', ()=>setTab('today'));
    tabWeek.addEventListener('click', ()=>setTab('week'));
    tabMonth.addEventListener('click', ()=>setTab('month'));
    tabTotal.addEventListener('click', ()=>setTab('total'));

    function openGate(){ gateErr.style.display='none'; gateInput.value=''; gateOverlay.classList.add('show'); setTimeout(()=>gateInput.focus(), 50); }
    function closeGate(){ gateOverlay.classList.remove('show'); }

    async function openDashboard(){
      closeGate();
      dashOverlay.classList.add('show');
      dashBody.innerHTML = '<div class="loading-txt">Yuklanmoqda...</div>';
      let tries = 0;
      while(typeof window.__loadStats !== 'function' && tries < 50){ await new Promise(r=>setTimeout(r,100)); tries++; }
      if(typeof window.__loadStats !== 'function'){ dashBody.innerHTML = '<div class="loading-txt">Tizim hali yuklanmadi, sahifani yangilang.</div>'; return; }
      try{
        lastStats = await window.__loadStats();
        setTab(activeTab);
      }catch(e){
        dashBody.innerHTML = '<div class="loading-txt">Ma\'lumot olishda xatolik. Realtime Database qoidalarini (rules) tekshiring.<br><br><b>Qoidalar bunday bo\'lishi kerak:</b><br><code>{ "rules": { ".read": true, ".write": true } }</code></div>';
      }
    }

    document.getElementById('analyticsDevLink').addEventListener('click', openGate);
    document.getElementById('gateCancel').addEventListener('click', closeGate);
    document.getElementById('dashClose').addEventListener('click', ()=>dashOverlay.classList.remove('show'));
    document.getElementById('gateSubmit').addEventListener('click', ()=>{
      if(gateInput.value.trim() === ACCESS_CODE){ openDashboard(); }
      else{ gateErr.style.display='block'; }
    });
    gateInput.addEventListener('keyup', (e)=>{ if(e.key==='Enter') document.getElementById('gateSubmit').click(); });
    gateOverlay.addEventListener('click', (e)=>{ if(e.target===gateOverlay) closeGate(); });
    dashOverlay.addEventListener('click', (e)=>{ if(e.target===dashOverlay) dashOverlay.classList.remove('show'); });
  })();
  </script>
</body>
</html>
